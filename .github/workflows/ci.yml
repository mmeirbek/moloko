name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-trixie  # PostgreSQL 17 + pgvector, as in production
        env:
          POSTGRES_USER: moloko
          POSTGRES_PASSWORD: moloko
          POSTGRES_DB: moloko_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moloko -d moloko_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: valkey/valkey:9.1.3-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://moloko:moloko@127.0.0.1:5432/moloko_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.32/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Backend checks
        run: infrastructure/scripts/test-api.sh

  web:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generated API types are up to date
        run: npm run check:types
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images and Compose file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose.yml
        run: POSTGRES_PASSWORD=x SECRET_KEY=x docker compose config --quiet
      - name: Build images
        run: |
          docker build -f infrastructure/docker/api.Dockerfile -t moloko-backend:ci .
          docker build -f infrastructure/docker/web.Dockerfile -t moloko-frontend:ci .
