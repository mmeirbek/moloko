name: E2E

# Browser tests against a full throwaway stack (Docker Compose + offline mock model).
# Manual for now: it builds all images and takes several minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright against docker compose
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Build, start and test
        run: infrastructure/scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
