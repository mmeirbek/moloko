# Blueprint для Render: New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: peter-office
    runtime: docker
    plan: starter # постоянный диск есть только на платных планах
    healthCheckPath: /api/health
    disk:
      name: office-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MODEL
        value: claude-opus-5-5
      - key: DAILY_BUDGET_USD
        value: "10"
