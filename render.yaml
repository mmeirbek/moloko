# Blueprint для Render: New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: peter-office
    runtime: docker
    plan: standard # постоянный диск есть только на платных планах; 2 ГБ памяти хватит на 3 отдела одновременно
    healthCheckPath: /api/health
    disk:
      name: office-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DAILY_BUDGET_USD
        value: "10"
