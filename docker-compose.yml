# moloko — production stack for the home server.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
#
# Only the Caddy proxy publishes a port, and only on 127.0.0.1 by default:
# Tailscale Serve forwards your tailnet's HTTPS traffic to it (docs/deployment.md).
# PostgreSQL and Redis live on an internal network with no route to the outside.

name: moloko

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-moloko}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moloko}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # Optional fallback API keys (official keys only). Usually set per provider in Settings.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-120}
  PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-2}
  ENABLE_MOCK_PROVIDER: ${ENABLE_MOCK_PROVIDER:-false}
  # Agent execution limits (spec 7.2)
  MAX_ACTIVE_SUBAGENTS_PER_RUN: ${MAX_ACTIVE_SUBAGENTS_PER_RUN:-5}
  MAX_SUBAGENT_DEPTH: ${MAX_SUBAGENT_DEPTH:-2}
  MAX_STEPS_PER_RUN: ${MAX_STEPS_PER_RUN:-50}
  RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-1800}
  MAX_RETRIES_PER_STEP: ${MAX_RETRIES_PER_STEP:-2}
  MAX_PARALLEL_TOOL_CALLS: ${MAX_PARALLEL_TOOL_CALLS:-3}
  APPROVAL_TTL_MINUTES: ${APPROVAL_TTL_MINUTES:-60}
  # Tools (spec 15/16). The worker reaches the sandbox runner on the internal network.
  SANDBOX_URL: http://sandbox:8090
  SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
  SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-60}
  SEARXNG_URL: ${SEARXNG_URL:-}
  WORKSPACE_TASK_TTL_DAYS: ${WORKSPACE_TASK_TTL_DAYS:-14}
  MEMORY_CONTEXT_MAX_CHARS: ${MEMORY_CONTEXT_MAX_CHARS:-8000}
  MEMORY_ENTRY_MAX_CHARS: ${MEMORY_ENTRY_MAX_CHARS:-4000}
  # Web Push (notifications while the app is closed) and the official GitHub MCP server
  PUSH_CONTACT: ${PUSH_CONTACT:-mailto:owner@moloko.invalid}
  PUSH_TTL_SECONDS: ${PUSH_TTL_SECONDS:-86400}
  GITHUB_MCP_URL: ${GITHUB_MCP_URL:-https://api.githubcopilot.com/mcp/}
  # The backend is reachable only from Caddy on the Docker network.
  FORWARDED_ALLOW_IPS: "*"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    <<: *hardening
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moloko}
      POSTGRES_USER: ${POSTGRES_USER:-moloko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  redis:
    image: valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    <<: *hardening
    # Valkey (Redis-compatible, BSD-3) holds no durable state (spec invariant 2); snapshots only speed up restarts.
    volumes:
      - valkey-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: moloko-backend:local
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    volumes:
      - workspaces:/data/workspaces  # read by the owner's workspace browser
      - ${BACKUP_DIR:-./backups}:/backups:ro  # backup status for Settings → Backups
    # "internal" for PostgreSQL/Redis, "edge" for Caddy and outbound calls to AI providers.
    networks: [internal, edge]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *logging

  worker:
    image: moloko-backend:local  # same image as the backend
    command: ["arq", "app.workers.main.WorkerSettings"]
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - workspaces:/data/workspaces  # file tools work here
    # Needs PostgreSQL/Redis (internal) and AI providers (edge). No published ports.
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Running agents checkpoint and re-queue themselves on SIGTERM.
    stop_grace_period: 30s
    logging: *logging

  # The ONLY service with the Docker socket. It runs each agent command in a fresh,
  # locked-down container (no network, non-root, read-only root, limits) with just that
  # task's workspace mounted (docs/security.md). It has no database or app secrets.
  sandbox:
    image: moloko-backend:local  # same image, different program
    entrypoint: []
    command: ["uvicorn", "app.sandbox.runner:app", "--factory", "--host", "0.0.0.0",
              "--port", "8090", "--no-server-header"]
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    group_add: ["${DOCKER_GID:-999}"]  # the host's docker group (init-env.sh detects it)
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12.16-slim}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-128}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-60}
      SANDBOX_WORKSPACES_VOLUME: ${WORKSPACES_VOLUME:-moloko_workspaces}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/v1/health', timeout=4)"
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 15s
    logging: *logging

  # Daily PostgreSQL dump + workspace archive, verified and rotated; weekly restore drill.
  # BACKUP_DIR must be on ANOTHER disk (infrastructure/backup/README.md).
  backup:
    image: postgres:17.11-alpine
    entrypoint: []
    command: ["sh", "/scripts/loop.sh"]
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]  # write into a BACKUP_DIR owned by the host user
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-moloko}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-moloko}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./infrastructure/backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - workspaces:/data/workspaces:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U \"$${PGUSER}\""]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    image: moloko-frontend:local
    restart: unless-stopped
    <<: *hardening
    cap_drop: [ALL]
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/caddy-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  internal:
    internal: true
  edge: {}

volumes:
  workspaces:
    name: ${WORKSPACES_VOLUME:-moloko_workspaces}  # fixed name: the sandbox runner mounts subpaths of it
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
