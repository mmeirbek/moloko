<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1f1930" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Офис" />
  <title>Офис субагентов</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preload" href="/fonts/Handjet-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Вход -->
  <section id="login" class="login hidden">
    <form id="login-form" class="login-card px">
      <img class="login-logo" data-icon="office" alt="" />
      <h1>ОФИС СУБАГЕНТОВ</h1>
      <p class="muted">Введите пароль, чтобы войти к своей команде</p>
      <input id="login-password" type="password" placeholder="Пароль" autocomplete="current-password" required />
      <button type="submit" class="btn primary">Войти</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <!-- Приложение -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><img data-icon="office" alt="" /> ОФИС</div>
      <div class="topbar-right">
        <span id="limit-chip" class="limit-chip"></span>
        <button id="notify-btn" class="icon-btn" title="Уведомления"><img class="bell" data-icon="bell" alt="Уведомления" /></button>
        <span id="conn" class="conn" title="Связь с сервером"></span>
      </div>
    </header>

    <div id="questions" class="questions"></div>

    <main id="view" class="view"></main>

    <button id="fab" class="fab" aria-label="Новое задание">+ ЗАДАНИЕ</button>

    <nav class="tabbar">
      <button data-tab="office" class="active"><img data-icon="office" alt="" />Офис</button>
      <button data-tab="panel"><img data-icon="panel" alt="" />Пульт<span id="panel-badge" class="tab-badge hidden"></span></button>
      <button data-tab="feed"><img data-icon="chat" alt="" />Лента</button>
      <button data-tab="files"><img data-icon="files" alt="" />Диск</button>
      <button data-tab="groups"><img data-icon="team" alt="" />Отделы</button>
    </nav>
  </div>

  <!-- Нижняя шторка для деталей -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-handle" data-close></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
